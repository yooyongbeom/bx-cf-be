import org.springframework.boot.gradle.tasks.run.BootRun

plugins {
    id 'java'
//    id 'org.springframework.boot' version '3.3.4' apply false               // root에서만 버전 고정
//    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '3.3.4' apply false               // root에서만 버전 고정
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

//bootJar.enabled = false
//jar.enabled = true

// 루트 프로젝트 + 모든 서브 프로젝트(subprojects)에 적용되는 설정
allprojects {
    group = 'com.bwg.channel'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}


subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    // Boot BOM은 org.springframework.boot 플러그인이 자동 적용한다.
    // Spring Cloud BOM만 별도로 전 모듈에 공통 적용해 모듈별 중복을 없앤다.
    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloud.get()}"
        }
    }

//    configurations.all {
//        resolutionStrategy {
//            force 'org.springframework:spring-web:6.0.14'
//            force 'org.springframework:spring-webflux:6.0.14'
//            force 'org.springframework:spring-core:6.0.14'
//        }
//    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // 모든 서브 프로젝트에서 Spring Boot 테스트 환경 사용 가능
    // Junit, Mockito, Spring Test
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.named('test') {
        useJUnitPlatform()      // JUnit 5
    }

    tasks.withType(org.springframework.boot.gradle.tasks.bundling.BootJar).configureEach {
        destinationDirectory = rootProject.file("build/dist/bx-cf-be")
    }
}

name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      auth:      ${{ steps.filter.outputs.auth }}
      integration: ${{ steps.filter.outputs.integration }}
      mci:       ${{ steps.filter.outputs.mci }}
      product:   ${{ steps.filter.outputs.product }}
      system:    ${{ steps.filter.outputs.system }}
      all:       ${{ steps.filter.outputs.all }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-svc/**'
            integration:
              - 'services/integration-svc/**'
              - 'src/main/resources/config/integration-svc/**'
            # mci-common은 mci-svc 실행 계약이므로 공통 모듈 변경도 mci-svc 단독 배포 대상으로 본다.
            mci:
              - 'services/mci-svc/**'
              - 'libs/mci-common/**'
              - 'src/main/resources/config/mci-svc/**'
            product:
              - 'services/product-svc/**'
            system:
              - 'services/system-svc/**'
              - 'src/main/resources/config/system-svc/**'
            all:
              - 'libs/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/**'

  deploy-auth:
    needs: detect
    if: needs.detect.outputs.all != 'true' && needs.detect.outputs.auth == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build auth-svc
        run: ./gradlew :services:auth-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy auth-svc
        run: |
          mkdir -p ~/apps/bx-cf-be/auth-svc
          cp build/dist/bx-cf-be/auth-svc-*.jar ~/apps/bx-cf-be/auth-svc/auth-svc-0.0.1-SNAPSHOT.jar

      - name: Restart auth-svc
        run: |
          PID_FILE=~/apps/bx-cf-be/auth-svc/auth-svc.pid
          if [ -f "$PID_FILE" ]; then
            kill $(cat $PID_FILE) 2>/dev/null || true
            rm -f $PID_FILE
          fi
          mkdir -p ~/apps/bx-cf-be/logs
          env -u RUNNER_TRACKING_ID nohup java -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m \
            -Dspring.profiles.active=dev \
            -jar ~/apps/bx-cf-be/auth-svc/auth-svc-0.0.1-SNAPSHOT.jar \
            < /dev/null > ~/apps/bx-cf-be/logs/auth-svc-bootstrap.log 2>&1 &
          echo $! > $PID_FILE

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - auth-svc"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - auth-svc"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BXCFBE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_BXCFBE is not configured. Skipping Discord notification."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ 배포 성공 - auth-svc"
            COLOR=51004
          else
            TITLE="❌ 배포 실패 - auth-svc"
            COLOR=16272203
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"커밋\", \"value\": \"${{ github.event.head_commit.message }}\", \"inline\": false},
                  {\"name\": \"작업자\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ]
              }]
            }" || true

  deploy-integration:
    needs: detect
    if: needs.detect.outputs.all != 'true' && needs.detect.outputs.integration == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build integration-svc
        run: ./gradlew :services:integration-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy integration-svc
        run: |
          mkdir -p ~/apps/bx-cf-be/integration-svc
          cp build/dist/bx-cf-be/integration-svc-*.jar ~/apps/bx-cf-be/integration-svc/integration-svc-0.0.1-SNAPSHOT.jar

      - name: Restart integration-svc
        run: |
          PID_FILE=~/apps/bx-cf-be/integration-svc/integration-svc.pid
          if [ -f "$PID_FILE" ]; then
            kill $(cat $PID_FILE) 2>/dev/null || true
            rm -f $PID_FILE
          fi
          mkdir -p ~/apps/bx-cf-be/logs
          env -u RUNNER_TRACKING_ID nohup java -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m \
            -Dspring.profiles.active=dev \
            -jar ~/apps/bx-cf-be/integration-svc/integration-svc-0.0.1-SNAPSHOT.jar \
            < /dev/null > ~/apps/bx-cf-be/logs/integration-svc-bootstrap.log 2>&1 &
          echo $! > $PID_FILE

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - integration-svc"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - integration-svc"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BXCFBE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_BXCFBE is not configured. Skipping Discord notification."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ 배포 성공 - integration-svc"
            COLOR=51004
          else
            TITLE="❌ 배포 실패 - integration-svc"
            COLOR=16272203
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"커밋\", \"value\": \"${{ github.event.head_commit.message }}\", \"inline\": false},
                  {\"name\": \"작업자\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ]
              }]
            }" || true

  deploy-mci:
    needs: detect
    # infra/scripts/libs 전체 변경이 아니고 MCI 관련 파일만 바뀐 경우 mci-svc만 재기동한다.
    if: needs.detect.outputs.all != 'true' && needs.detect.outputs.mci == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mci-svc
        run: ./gradlew :services:mci-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy mci-svc
        run: |
          mkdir -p ~/apps/bx-cf-be/mci-svc
          cp build/dist/bx-cf-be/mci-svc-*.jar ~/apps/bx-cf-be/mci-svc/mci-svc-0.0.1-SNAPSHOT.jar

      - name: Restart mci-svc
        run: |
          PID_FILE=~/apps/bx-cf-be/mci-svc/mci-svc.pid
          # 기존 프로세스를 먼저 내린 뒤 같은 PID 파일 위치로 새 프로세스를 기록한다.
          if [ -f "$PID_FILE" ]; then
            kill $(cat $PID_FILE) 2>/dev/null || true
            rm -f $PID_FILE
          fi
          mkdir -p ~/apps/bx-cf-be/logs
          env -u RUNNER_TRACKING_ID nohup java -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m \
            -Dspring.profiles.active=dev \
            -jar ~/apps/bx-cf-be/mci-svc/mci-svc-0.0.1-SNAPSHOT.jar \
            < /dev/null > ~/apps/bx-cf-be/logs/mci-svc-bootstrap.log 2>&1 &
          echo $! > $PID_FILE

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - mci-svc"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - mci-svc"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BXCFBE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_BXCFBE is not configured. Skipping Discord notification."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ 배포 성공 - mci-svc"
            COLOR=51004
          else
            TITLE="❌ 배포 실패 - mci-svc"
            COLOR=16272203
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"커밋\", \"value\": \"${{ github.event.head_commit.message }}\", \"inline\": false},
                  {\"name\": \"작업자\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ]
              }]
            }" || true

  deploy-product:
    needs: detect
    if: needs.detect.outputs.all != 'true' && needs.detect.outputs.product == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build product-svc
        run: ./gradlew :services:product-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy product-svc
        run: |
          mkdir -p ~/apps/bx-cf-be/product-svc
          cp build/dist/bx-cf-be/product-svc-*.jar ~/apps/bx-cf-be/product-svc/product-svc-0.0.1-SNAPSHOT.jar

      - name: Restart product-svc
        run: |
          PID_FILE=~/apps/bx-cf-be/product-svc/product-svc.pid
          if [ -f "$PID_FILE" ]; then
            kill $(cat $PID_FILE) 2>/dev/null || true
            rm -f $PID_FILE
          fi
          mkdir -p ~/apps/bx-cf-be/logs
          env -u RUNNER_TRACKING_ID nohup java -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m \
            -Dspring.profiles.active=dev \
            -jar ~/apps/bx-cf-be/product-svc/product-svc-0.0.1-SNAPSHOT.jar \
            < /dev/null > ~/apps/bx-cf-be/logs/product-svc-bootstrap.log 2>&1 &
          echo $! > $PID_FILE

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - product-svc"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - product-svc"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BXCFBE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_BXCFBE is not configured. Skipping Discord notification."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ 배포 성공 - product-svc"
            COLOR=51004
          else
            TITLE="❌ 배포 실패 - product-svc"
            COLOR=16272203
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"커밋\", \"value\": \"${{ github.event.head_commit.message }}\", \"inline\": false},
                  {\"name\": \"작업자\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ]
              }]
            }" || true

  deploy-system:
    needs: detect
    if: needs.detect.outputs.all != 'true' && needs.detect.outputs.system == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build system-svc
        run: ./gradlew :services:system-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy system-svc
        run: |
          mkdir -p ~/apps/bx-cf-be/system-svc
          cp build/dist/bx-cf-be/system-svc-*.jar ~/apps/bx-cf-be/system-svc/system-svc-0.0.1-SNAPSHOT.jar

      - name: Restart system-svc
        run: |
          PID_FILE=~/apps/bx-cf-be/system-svc/system-svc.pid
          if [ -f "$PID_FILE" ]; then
            kill $(cat $PID_FILE) 2>/dev/null || true
            rm -f $PID_FILE
          fi
          mkdir -p ~/apps/bx-cf-be/logs
          env -u RUNNER_TRACKING_ID nohup java -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m \
            -Dspring.profiles.active=dev \
            -jar ~/apps/bx-cf-be/system-svc/system-svc-0.0.1-SNAPSHOT.jar \
            < /dev/null > ~/apps/bx-cf-be/logs/system-svc-bootstrap.log 2>&1 &
          echo $! > $PID_FILE

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - system-svc"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - system-svc"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BXCFBE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_BXCFBE is not configured. Skipping Discord notification."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ 배포 성공 - system-svc"
            COLOR=51004
          else
            TITLE="❌ 배포 실패 - system-svc"
            COLOR=16272203
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"커밋\", \"value\": \"${{ github.event.head_commit.message }}\", \"inline\": false},
                  {\"name\": \"작업자\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ]
              }]
            }" || true

  deploy-all:
    needs: detect
    if: needs.detect.outputs.all == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all services
        # libs/infra/scripts/workflow 변경은 영향 범위를 특정하기 어려워 전체 서비스를 다시 빌드한다.
        run: ./gradlew :infra:discovery-svc:bootJar :infra:api-gateway:bootJar :services:auth-svc:bootJar :services:integration-svc:bootJar :services:mci-svc:bootJar :services:product-svc:bootJar :services:system-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy all JARs
        run: |
          # start-all.sh가 기대하는 서비스별 디렉터리/JAR 이름으로 배포 산출물을 고정한다.
          mkdir -p ~/apps/bx-cf-be/logs
          mkdir -p ~/apps/bx-cf-be/discovery-svc
          mkdir -p ~/apps/bx-cf-be/auth-svc
          mkdir -p ~/apps/bx-cf-be/integration-svc
          mkdir -p ~/apps/bx-cf-be/mci-svc
          mkdir -p ~/apps/bx-cf-be/product-svc
          mkdir -p ~/apps/bx-cf-be/system-svc
          mkdir -p ~/apps/bx-cf-be/api-gateway
          cp build/dist/bx-cf-be/discovery-svc-*.jar ~/apps/bx-cf-be/discovery-svc/discovery-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/auth-svc-*.jar      ~/apps/bx-cf-be/auth-svc/auth-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/integration-svc-*.jar ~/apps/bx-cf-be/integration-svc/integration-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/mci-svc-*.jar       ~/apps/bx-cf-be/mci-svc/mci-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/product-svc-*.jar   ~/apps/bx-cf-be/product-svc/product-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/system-svc-*.jar    ~/apps/bx-cf-be/system-svc/system-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/api-gateway-*.jar   ~/apps/bx-cf-be/api-gateway/api-gateway-0.0.1-SNAPSHOT.jar

      - name: Stop all services
        run: |
          chmod +x ${{ github.workspace }}/scripts/stop-all.sh
          ${{ github.workspace }}/scripts/stop-all.sh || true

      - name: Start all services
        run: |
          chmod +x ${{ github.workspace }}/scripts/start-all.sh
          ${{ github.workspace }}/scripts/start-all.sh

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - 전체 서비스"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - 전체 서비스"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BXCFBE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_BXCFBE is not configured. Skipping Discord notification."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ 배포 성공 - 전체 서비스"
            COLOR=51004
          else
            TITLE="❌ 배포 실패 - 전체 서비스"
            COLOR=16272203
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"브랜치\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"커밋\", \"value\": \"${{ github.event.head_commit.message }}\", \"inline\": false},

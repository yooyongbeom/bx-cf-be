name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      auth:      ${{ steps.filter.outputs.auth }}
      product:   ${{ steps.filter.outputs.product }}
      all:       ${{ steps.filter.outputs.all }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-svc/**'
            product:
              - 'services/product-svc/**'
            all:
              - 'libs/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/**'

  deploy-auth:
    needs: detect
    if: needs.detect.outputs.all != 'true' && needs.detect.outputs.auth == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build auth-svc
        run: ./gradlew :services:auth-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy auth-svc
        run: |
          mkdir -p ~/apps/bx-cf-be/auth-svc
          cp build/dist/bx-cf-be/auth-svc-*.jar ~/apps/bx-cf-be/auth-svc/auth-svc-0.0.1-SNAPSHOT.jar

      - name: Restart auth-svc
        run: |
          PID_FILE=~/apps/bx-cf-be/auth-svc/auth-svc.pid
          if [ -f "$PID_FILE" ]; then
            kill $(cat $PID_FILE) 2>/dev/null || true
            rm -f $PID_FILE
          fi
          nohup java -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m \
            -Dspring.profiles.active=dev \
            -jar ~/apps/bx-cf-be/auth-svc/auth-svc-0.0.1-SNAPSHOT.jar \
            > /dev/null 2>&1 &
          echo $! > $PID_FILE

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - auth-svc"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - auth-svc"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

  deploy-product:
    needs: detect
    if: needs.detect.outputs.all != 'true' && needs.detect.outputs.product == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build product-svc
        run: ./gradlew :services:product-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy product-svc
        run: |
          mkdir -p ~/apps/bx-cf-be/product-svc
          cp build/dist/bx-cf-be/product-svc-*.jar ~/apps/bx-cf-be/product-svc/product-svc-0.0.1-SNAPSHOT.jar

      - name: Restart product-svc
        run: |
          PID_FILE=~/apps/bx-cf-be/product-svc/product-svc.pid
          if [ -f "$PID_FILE" ]; then
            kill $(cat $PID_FILE) 2>/dev/null || true
            rm -f $PID_FILE
          fi
          nohup java -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m \
            -Dspring.profiles.active=dev \
            -jar ~/apps/bx-cf-be/product-svc/product-svc-0.0.1-SNAPSHOT.jar \
            > /dev/null 2>&1 &
          echo $! > $PID_FILE

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - product-svc"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - product-svc"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

  deploy-all:
    needs: detect
    if: needs.detect.outputs.all == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all services
        run: ./gradlew :infra:discovery-svc:bootJar :infra:api-gateway:bootJar :services:auth-svc:bootJar :services:product-svc:bootJar -Pprofile=dev --no-daemon

      - name: Deploy all JARs
        run: |
          mkdir -p ~/apps/bx-cf-be/logs
          mkdir -p ~/apps/bx-cf-be/discovery-svc
          mkdir -p ~/apps/bx-cf-be/auth-svc
          mkdir -p ~/apps/bx-cf-be/product-svc
          mkdir -p ~/apps/bx-cf-be/api-gateway
          cp build/dist/bx-cf-be/discovery-svc-*.jar ~/apps/bx-cf-be/discovery-svc/discovery-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/auth-svc-*.jar      ~/apps/bx-cf-be/auth-svc/auth-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/product-svc-*.jar   ~/apps/bx-cf-be/product-svc/product-svc-0.0.1-SNAPSHOT.jar
          cp build/dist/bx-cf-be/api-gateway-*.jar   ~/apps/bx-cf-be/api-gateway/api-gateway-0.0.1-SNAPSHOT.jar

      - name: Stop all services
        run: |
          chmod +x ${{ github.workspace }}/scripts/stop-all.sh
          ${{ github.workspace }}/scripts/stop-all.sh || true

      - name: Start all services
        run: |
          chmod +x ${{ github.workspace }}/scripts/start-all.sh
          ${{ github.workspace }}/scripts/start-all.sh

      - name: Notify Jandi
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="#00C73C"
            TITLE="✅ 배포 성공 - 전체 서비스"
          else
            COLOR="#F84B4B"
            TITLE="❌ 배포 실패 - 전체 서비스"
          fi
          curl -s -X POST "${{ secrets.JANDI_HOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"body\": \"$TITLE\",
              \"connectColor\": \"$COLOR\",
              \"connectInfo\": [
                {\"title\": \"브랜치\", \"description\": \"${{ github.ref_name }}\"},
                {\"title\": \"커밋\", \"description\": \"${{ github.event.head_commit.message }}\"},
                {\"title\": \"작업자\", \"description\": \"${{ github.actor }}\"}
              ]
            }"

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    api 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.springframework:spring-web'

    // Spring Boot AOP
    api 'org.springframework.boot:spring-boot-starter-aop'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JPA
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // MyBatis
    api libs.mybatis.spring.boot.starter

    // OpenAPI(swagger) 모델 타입 - 공통 헬퍼 컴파일용. 런타임 springdoc 스타터는 각 서비스가 제공
    compileOnly libs.springdoc.common
    compileOnly libs.springdoc.webmvc.ui
    testImplementation libs.springdoc.webmvc.ui
}

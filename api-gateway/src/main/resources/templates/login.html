<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LOGIN TEST</title>
</head>
<body>
<h2>로그인</h2>
<form id="loginForm">
    <input type="text" name="usrId" placeholder="아이디" required>
    <input type="password" name="usrPwd" placeholder="비밀번호" required>
    <button type="submit">LOGIN TEST</button>
</form>
<script>
    async function sha256(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer))
            .map(b => b.toString(16).padStart(2,'0'))
            .join('');
    }

    async function goHome(tkn) {
        fetch('/te/home', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + tkn,
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: ''
        })
        .then(res => res.text()) // Thymeleaf 페이지는 text/html
        .then(html => {
            // 현재 페이지를 /home HTML로 덮어쓰기
            console.log(html);
            document.open();
            document.write(html);
            document.close();
        })
        .catch(err => console.error(err));
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const form = new FormData(e.target);
        //const params = new URLSearchParams(form);
        const hashedPassword = await sha256(form.get('usrPwd'));

        const res = await fetch('/channel/backend/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                usrId: form.get('usrId'),
                usrPwd: hashedPassword
            })
        });
        if (res.ok) {
            const data = await res.json();
            console.log(data);
            if (data.code === '0') {
                alert("로그인 성공");
                goHome(data.payload.accessToken);
            }
            else {
                alert(data.msg);
            }
        }
        else {
            const data = await res.json();
            console.log(data);
            alert("로그인 실패");
        }
    });
</script>
</body>
</html>

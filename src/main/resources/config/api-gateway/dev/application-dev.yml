spring:
  config:
    import: "classpath:/application-securitycommon-dev.yml"   # security-common 설정 import
  lifecycle:
    timeout-per-shutdown-phase: 35s
  # valkey - 세션 존재 검증(로그아웃 시 access token 무효화)용. auth-svc와 동일 인스턴스.
  data:
    redis:
      host: 192.168.110.217
      port: 6379
      timeout: 2s
server:
  port: 18081
  shutdown: graceful
eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://192.168.110.217:18761/eureka"
    register-with-eureka: true
    fetch-registry: true
app:
  test: "api-gateway"
  log-path: /Users/channelunit/apps/bx-cf-be/logs
  cors:
    allowed-origin-patterns:
      - http://192.168.110.217
      - http://localhost:3000
      - http://127.0.0.1:3000

# 로그아웃 시 access token 즉시 무효화: 인증 필요 요청마다 sessionId가 Redis에 살아있는지 검증
gateway:
  session-check:
    enabled: true        # 세션 존재 검증 on/off
    fail-open: false      # Redis 조회 실패 시 정책. 기본 fail-closed(거부). valkey HA 미비 시에만 true
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: INFO

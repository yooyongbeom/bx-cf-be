spring:
  config:
    import: "classpath:/application-authcore-dev.yml"   # auth-core 설정 import
  lifecycle:
    timeout-per-shutdown-phase: 35s
server:
  port: 18081
bwgProp:
  test: "api-gateway"
eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://localhost:18761/eureka"
    register-with-eureka: true
    fetch-registry: true
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: INFO

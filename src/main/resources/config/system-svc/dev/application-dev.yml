spring:
  # DB 접속정보는 프로필별 환경변수로 주입하고 저장소에 자격증명을 남기지 않는다.
  datasource:
    mybatis-main:
      jdbc-url: ${BX_SYSTEM_DEV_DB_URL}
      driver-class-name: org.postgresql.Driver
      username: ${BX_SYSTEM_DEV_DB_USERNAME}
      password: ${BX_SYSTEM_DEV_DB_PASSWORD}
      hikari:
        pool-name: mybatis-main-hikari-pool

  lifecycle:
    timeout-per-shutdown-phase: 35s

server:
  port: 18084
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://192.168.110.217:18761/eureka"
    register-with-eureka: true
    fetch-registry: true

app:
  log-path: /Users/channelunit/apps/bx-cf-be/logs

logging:
  level:
    p6spy: INFO

p6spy:
  engine:
    spy:
      log-message-format: com.p6spy.engine.spy.appender.MultiLineFormat

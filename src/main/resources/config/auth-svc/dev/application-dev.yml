spring:
  # DB 접속정보는 프로필별 환경변수로 주입하고 저장소에 자격증명을 남기지 않는다.
  datasource:
    # 'jpa-main' DataSource (JPA용)
    jpa-main:
      jdbc-url: ${BX_AUTH_DEV_DB_URL}
      driver-class-name: org.postgresql.Driver
      username: ${BX_AUTH_DEV_DB_USERNAME}
      password: ${BX_AUTH_DEV_DB_PASSWORD}
      hikari:
        pool-name: jpa-main-hikari-pool
    # 'mybatis-main' DataSource (MyBatis용)
    mybatis-main:
      jdbc-url: ${BX_AUTH_DEV_DB_URL}
      driver-class-name: org.postgresql.Driver
      username: ${BX_AUTH_DEV_DB_USERNAME}
      password: ${BX_AUTH_DEV_DB_PASSWORD}
      hikari:
        pool-name: mybatis-main-hikari-pool

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: true

  config:
    import: "classpath:/application-securitycommon-dev.yml"
  lifecycle:
    timeout-per-shutdown-phase: 35s

  # valkey
  data:
    redis:
      host: 192.168.110.217
      port: 6379
      timeout: 2s

server:
  tomcat:
    max-swallow-size: -1
  port: 18082
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://192.168.110.217:18761/eureka"
    register-with-eureka: true
    fetch-registry: true

app:
  erp-login-url: "https://erp.bankwareglobal.com/serviceEndpoint/httpService/request.json"
  log-path: /Users/channelunit/apps/bx-cf-be/logs
  auth:
    refresh-cookie:
      name: refreshToken
      path: /channel/backend/api/v1/auth
      same-site: Lax
      secure: false
      max-age-seconds: 604800

logging:
  level:
    # 인증 서비스의 SQL 바인딩 값에 포함된 평문 자격 증명을 로그로 남기지 않는다.
    p6spy: OFF

p6spy:
  engine:
    spy:
      log-message-format: com.p6spy.engine.spy.appender.MultiLineFormat

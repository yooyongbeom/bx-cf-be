spring:
  datasource:
    # 'jpa-main' DataSource (JPA용)
    jpa-main:
      jdbc-url: jdbc:h2:mem:auth-db
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: jpa-main-hikari-pool
    # 'mybatis-main' DataSource (MyBatis용)
    mybatis-main:
      jdbc-url: jdbc:h2:mem:auth-db
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: mybatis-main-hikari-pool

  # H2 웹 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # p6spy를 사용하므로 Hibernate 자체 로그는 비활성화
        show_sql: false
        format_sql: false
        use_sql_comments: true

  config:
    # auth-core 설정 import
    import: "classpath:/application-authcore-local.yml"
  lifecycle:
    timeout-per-shutdown-phase: 35s
server:
  tomcat:
    max-swallow-size: -1
  port: 18082
  shutdown: graceful
bwgProp:
  erp-login-url: "https://erp.bankwareglobal.com/serviceEndpoint/httpService/request.json"
eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://localhost:18761/eureka"
    register-with-eureka: true
    fetch-registry: true
logging:
  level:
    # p6spy의 DEBUG 레벨 로그(PreparedStatement)를 비활성화하고 INFO 레벨(최종 쿼리)만 출력
    p6spy: INFO

# p6spy 설정
p6spy:
  engine:
    spy:
      # MultiLineFormat을 사용하여 가독성 높은 SQL 로그 출력
      log-message-format: com.p6spy.engine.spy.appender.MultiLineFormat

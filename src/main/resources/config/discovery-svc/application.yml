spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active: local
  application:
     name: bwg-channel-backend-discovery
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

logging:
  file:
    name: ${app.log-path}/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: ${app.log-path}/${spring.application.name}-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

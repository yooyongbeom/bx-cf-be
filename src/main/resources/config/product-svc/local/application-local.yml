spring:
  datasource:
    jpa-main:
      jdbc-url: jdbc:h2:mem:product-db
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: jpa-main-hikari-pool
    mybatis-main:
      jdbc-url: jdbc:h2:mem:product-db
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: mybatis-main-hikari-pool

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: true

  config:
    import: "classpath:/application-authcore-local.yml"
  lifecycle:
    timeout-per-shutdown-phase: 35s

server:
  port: 18083
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://localhost:18761/eureka"
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    p6spy: INFO

p6spy:
  engine:
    spy:
      log-message-format: com.p6spy.engine.spy.appender.MultiLineFormat

spring:
  # DB 접속정보는 프로필별 환경변수로 주입하고 저장소에 자격증명을 남기지 않는다.
  datasource:
    # 'jpa-main' DataSource (JPA용)
    jpa-main:
      jdbc-url: ${BX_PRODUCT_LOCAL_DB_URL}
      driver-class-name: org.postgresql.Driver
      username: ${BX_PRODUCT_LOCAL_DB_USERNAME}
      password: ${BX_PRODUCT_LOCAL_DB_PASSWORD}
      hikari:
        pool-name: jpa-main-hikari-pool
    # 'mybatis-main' DataSource (MyBatis용)
    mybatis-main:
      jdbc-url: ${BX_PRODUCT_LOCAL_DB_URL}
      driver-class-name: org.postgresql.Driver
      username: ${BX_PRODUCT_LOCAL_DB_USERNAME}
      password: ${BX_PRODUCT_LOCAL_DB_PASSWORD}
      hikari:
        pool-name: mybatis-main-hikari-pool

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: true

  lifecycle:
    timeout-per-shutdown-phase: 35s

server:
  port: 18083
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://localhost:18761/eureka"
    register-with-eureka: true
    fetch-registry: true

app:
  log-path: ./logs

logging:
  level:
    p6spy: INFO

p6spy:
  engine:
    spy:
      log-message-format: com.p6spy.engine.spy.appender.MultiLineFormat

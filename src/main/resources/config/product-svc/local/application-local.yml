spring:
  datasource:
    jpa-main:
      jdbc-url: jdbc:postgresql://192.168.11.197:5432/bxcfdb
      driver-class-name: org.postgresql.Driver
      username: bxcf
      password: "1111"
      hikari:
        pool-name: jpa-main-hikari-pool
    mybatis-main:
      jdbc-url: jdbc:postgresql://192.168.11.197:5432/bxcfdb
      driver-class-name: org.postgresql.Driver
      username: bxcf
      password: "1111"
      hikari:
        pool-name: mybatis-main-hikari-pool

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: true

  config:
    import: "classpath:/application-authcore-local.yml"
  lifecycle:
    timeout-per-shutdown-phase: 35s

server:
  port: 18083
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: localhost
  client:
    service-url:
      defaultZone: "http://localhost:18761/eureka"
    register-with-eureka: true
    fetch-registry: true

app:
  log-path: C:/work/bx-cf-be/logs

logging:
  level:
    p6spy: INFO

p6spy:
  engine:
    spy:
      log-message-format: com.p6spy.engine.spy.appender.MultiLineFormat

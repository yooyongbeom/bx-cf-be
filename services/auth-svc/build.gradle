plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.bwg.channel.backend'
version = '0.0.1-SNAPSHOT'
description = 'bankwareglobal channel backend auth service'

// bootJAR로 패키징
bootJar.enabled = true
jar.enabled = false

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.4"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    implementation project(':libs:common')
    implementation project(':libs:business-common')
    implementation project(':libs:auth-core')
    implementation project(':libs:type-bridge')    // Customizer 빈이 런타임에 등록되어야 함

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // Swagger / OpenAPI (서블릿 MVC)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    //compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // DB
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

def activeProfile = project.hasProperty('profile') ? project.property('profile') : 'local'
processResources {

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.resources.srcDirs)

    // banner
    from(rootProject.file("src/main/resources")) {
        include "banner.txt"
        into "."
    }

    // mapper 파일
    def mapperDir = rootProject.file("src/main/resources/mapper/${project.name}")
    if (mapperDir.exists()) {
        from(mapperDir) {
            include '*.xml'
            into "mappers"
        }
    }

    // 모듈 공통 설정
    def moduleYml = rootProject.file("src/main/resources/config/${project.name}/application.yml")
    if (moduleYml.exists()) {
        from(moduleYml) { into "." }
    }

    // 지정된 프로파일 설정만 포함
    def profileDir = rootProject.file("src/main/resources/config/${project.name}/${activeProfile}")
    if (profileDir.exists()) {
        from(profileDir) { into "." }
    }

    // auth-core 설정
    def authCoreDir = rootProject.file("src/main/resources/config/auth-core/${activeProfile}")
    if (authCoreDir.exists()) {
        from(authCoreDir) {
            rename { fileName -> "application-authcore-${activeProfile}.yml" }
        }
    }
}

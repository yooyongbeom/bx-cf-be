plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.bwg.channel.backend'
version = '0.0.1-SNAPSHOT'
description = 'bankwareglobal channel backend system service'

bootJar.enabled = true
jar.enabled = false

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.4"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    implementation project(':libs:common')
    implementation project(':libs:business-common')
    implementation project(':libs:auth-core')
    implementation project(':libs:type-bridge')

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.1'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

def activeProfile = project.hasProperty('profile') ? project.property('profile') : 'local'
processResources {

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.resources.srcDirs)

    from(rootProject.file("src/main/resources")) {
        include "banner.txt"
        into "."
    }

    def mapperDir = rootProject.file("src/main/resources/mapper/${project.name}")
    if (mapperDir.exists()) {
        from(mapperDir) {
            include '*.xml'
            into "mappers"
        }
    }

    def moduleYml = rootProject.file("src/main/resources/config/${project.name}/application.yml")
    if (moduleYml.exists()) {
        from(moduleYml) { into "." }
    }

    def profileDir = rootProject.file("src/main/resources/config/${project.name}/${activeProfile}")
    if (profileDir.exists()) {
        from(profileDir) { into "." }
    }

    def authCoreDir = rootProject.file("src/main/resources/config/auth-core/${activeProfile}")
    if (authCoreDir.exists()) {
        from(authCoreDir) {
            rename { fileName -> "application-authcore-${activeProfile}.yml" }
        }
    }
}

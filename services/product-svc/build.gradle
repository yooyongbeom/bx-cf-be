plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.bwg.channel.backend'
version = '0.0.1-SNAPSHOT'
description = 'bankwareglobal channel backend product service'

bootJar.enabled = true
jar.enabled = false

dependencies {
    implementation project(':libs:common')
    implementation project(':libs:business-common')

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // Swagger / OpenAPI (서블릿 MVC)
    implementation libs.springdoc.webmvc.ui

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // DB
    implementation libs.p6spy.spring.boot.starter
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.mybatis.spring.boot.starter
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

def activeProfile = project.hasProperty('profile') ? project.property('profile') : 'local'
processResources {

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.resources.srcDirs)

    // banner
    from(rootProject.file("src/main/resources")) {
        include "banner.txt"
        into "."
    }

    // mapper 파일
    def mapperDir = rootProject.file("src/main/resources/mapper/${project.name}")
    if (mapperDir.exists()) {
        from(mapperDir) {
            include '*.xml'
            into "mappers"
        }
    }

    // 모듈 공통 설정
    def moduleYml = rootProject.file("src/main/resources/config/${project.name}/application.yml")
    if (moduleYml.exists()) {
        from(moduleYml) { into "." }
    }

    // 지정된 프로파일 설정만 포함
    def profileDir = rootProject.file("src/main/resources/config/${project.name}/${activeProfile}")
    if (profileDir.exists()) {
        from(profileDir) { into "." }
    }

}
